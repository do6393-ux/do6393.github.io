<!-- 내 계정 기본 설정 모달 -->
    <div id="profileSettingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-5 relative">
            <button id="closeProfileSettingsBtn" class="absolute top-4 right-4 text-slate-400 text-lg hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center">
                <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl"><i class="fa-solid fa-user-gear"></i></div>
                <h3 class="text-lg font-bold">내 계정 기본 설정</h3>
                <p class="text-xs text-slate-500 mt-1">로그인 시 자동으로 보여질 교사와 학급을 설정하세요.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">내 이름 (교사 성함 입력)</label>
                    <input type="text" id="profileTeacherInput" placeholder="선생님 성함 입력 (예: 신정훈)" class="w-full text-sm p-2.5 bg-slate-50 rounded-xl border border-slate-200 font-bold outline-none focus:ring-2 focus:ring-sky-400">
                    <select id="profileTeacherSelect" class="hidden"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">담당 학급 (담임)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="profileGradeSelect" class="w-full text-sm p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                        </select>
                        <select id="profileClassSelect" class="w-full text-sm p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                            <option value="1">1반</option>
                            <option value="2">2반</option>
                            <option value="3">3반</option>
                            <option value="4">4반</option>
                            <option value="5">5반</option>
                            <option value="6">6반</option>
                            <option value="7">7반</option>
                            <option value="8">8반</option>
                            <option value="9">9반</option>
                            <option value="10">10반</option>
                        </select>
                    </div>
                </div>
            </div>
            <button id="saveProfileSettingsBtn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm transition-colors">저장하기</button>
        </div>
    </div>
